}
function editProject(id) { var p = projectById(id); if (p) openProjectForm(p); }
function editTeam(id) { var t = teamById(id); if (t) openTeamForm(t); }
function editAgent(id) { var a = cfg.agents[id]; if (a) openAgentForm(a); }

function formButtons(submitFn, ent) {
  var html = '<div style="display:flex; gap:8px; margin-top:8px;">' +
    '<button class="primary" onclick="' + submitFn + '()">保存</button>';
  if (ent) html += '<button onclick="deleteEntity()" style="border-color:#e88;color:#c33">删除</button>';
  html += '<button onclick="closeModal()">取消</button></div>';
  return html;
}
// ---- 现代多选（可搜索勾选列表，替代原生 <select multiple>）----
function multiSelectHtml(id, label, items, selected) {
  var sel = selected || [];
  var cnt0 = sel.length ? (sel.length + ' 已选') : '';
  var opts = (items || []).map(function (it) {
    var on = sel.indexOf(it.id) >= 0 ? ' checked' : '';
    return '<label class="ms-opt' + (on ? ' on' : '') + '">' +
      '<input type="checkbox" data-id="' + it.id + '"' + on + ' onchange="msToggle(this)">' +
      '<span class="ms-name">' + esc(it.name) + '</span>' +
      '<span class="ms-check">✓</span></label>';
  }).join('');
  return '<div class="ms-field">' +
    '<div class="ms-head"><span>' + label + '</span><span class="ms-count" id="' + id + '_cnt">' + cnt0 + '</span></div>' +
    '<input class="ms-search" id="' + id + '_q" placeholder="搜索…" oninput="msFilter(\'' + id + '\', this.value)">' +
    '<div class="ms-list" id="' + id + '">' + opts + '</div></div>';
}
function msToggle(cb) {
  var lbl = cb.closest('.ms-opt');
  if (lbl) lbl.classList.toggle('on', cb.checked);
  msCount(cb.closest('.ms-list'));
}
function msCount(list) {
  if (!list) return;
  var n = list.querySelectorAll('input:checked').length;
  var c = document.getElementById(list.id + '_cnt');
  if (c) c.textContent = n ? (n + ' 已选') : '';
}
function msFilter(id, q) {
  var list = document.getElementById(id);
  if (!list) return;
  q = (q || '').toLowerCase();
  Array.prototype.slice.call(list.querySelectorAll('.ms-opt')).forEach(function (o) {
    var nm = o.querySelector('.ms-name').textContent.toLowerCase();
    o.style.display = nm.indexOf(q) >= 0 ? '' : 'none';
  });
}
function getMultiSelected(id) {
  var list = document.getElementById(id);
  if (!list) return [];
  return Array.prototype.slice.call(list.querySelectorAll('input:checked')).map(function (c) { return c.getAttribute('data-id'); });
}
function deleteEntity() {
  if (!editingId || !editingKind) return;
  var label = { agent: 'Agent', team: 'Team', project: '项目' }[editingKind] || '';
  if (!confirm('确定删除该' + label + '？此操作不可撤销。')) return;
  fetch('/api/' + editingKind + 's/' + editingId, { method: 'DELETE' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); })
    .then(closeModal).then(loadConfig).then(function () { setStatus('已删除 ✓', true); })
    .catch(function (e) { setStatus('删除失败: ' + e.message, false); });
}
function f(id, label, def) {
  def = def == null ? '' : String(def);
  var safe = def.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return '<label>' + label + '<br><input id="' + id + '" value="' + safe + '" style="width:100%"></label>';
}
function sel(id, label, opts, sel0) {
  var html = opts.map(function (o) {
    return '<option value="' + o[0] + '"' + (o[0] === sel0 ? ' selected' : '') + '>' + o[1] + '</option>';
  }).join('');
  return '<label>' + label + '<br><select id="' + id + '" style="width:100%; box-sizing:border-box;">' + html + '</select></label>';
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
  var c = document.getElementById('modalCard');
  if (c) { c.style.cssText = ''; c.className = 'card'; }   // 清掉设置面板内联样式与表单类，避免影响后续弹窗
}

// ---- 全局设置（timeout / 默认轮次等 App 级配置）----
function openSettings() {
  var c = document.getElementById('modalCard');
  var s = cfg.settings || {};
  var dt = s.default_timeout != null ? s.default_timeout : 300;
  var dmr = s.default_max_rounds != null ? s.default_max_rounds : 12;
  var dm = s.default_model || '';
  var dmc = s.default_model_codex || '';
  var ol = s.ollama_base_url || 'http://localhost:11434';
  var mo = s.claude_max_output_tokens != null ? s.claude_max_output_tokens : 64000;
  var th = s.ollama_think !== false;
  var ptCfg = (s.prompt_templates && s.prompt_templates.debate) || {};
  var ptDef = (s.prompt_template_defaults && s.prompt_template_defaults.debate) || {};
  // 显示「当前生效」文本：配置有就用配置，否则显示内置默认（可改、可恢复默认）
  var consVal = ptCfg.consensus != null ? ptCfg.consensus : (ptDef.consensus || '');
  var extraVal = ptCfg.extra_rules != null ? ptCfg.extra_rules : (ptDef.extra_rules || '');
  function field(id, label, def, help, type, wide) {
    type = type || 'text';
    def = def == null ? '' : String(def);
    var safe = def.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return '<div class="set-field' + (wide ? ' wide' : '') + '">' +
      '<label class="set-label" for="' + id + '">' + label + '</label>' +
      '<input id="' + id + '" class="set-input" type="' + type + '" value="' + safe + '">' +
      (help ? '<div class="set-help">' + help + '</div>' : '') +
      '</div>';
  }
  c.innerHTML =
    '<div class="set-head">' +
      '<div class="set-title">全局设置</div>' +
      '<div class="set-sub">对所有讨论统一生效 · 保存即生效，无需重启</div>' +
    '</div>' +
    '<div class="set-body" style="flex:1; min-height:0; overflow-y:auto;">' +
    '<div class="set-section">讨论参数</div>' +
    '<div class="set-grid">' +
      field('gTimeout', '单轮静默超时（秒）', dt, '某 agent 久不输出即判卡死并终止该轮', 'number') +
      field('gMaxRounds', '辩论默认轮次上限', dmr, '新发起讨论的预填值，手动改过则不覆盖', 'number') +
    '</div>' +
    '<div class="set-section">默认模型</div>' +
    '<div class="set-grid">' +
      field('gDefaultModel', 'Claude Code', dm, '留空＝自动探测 Claude Code 当前默认') +
      field('gDefaultModelCodex', 'Codex', dmc, '留空＝自动探测 Codex 当前默认') +
    '</div>' +
    '<div class="set-section">内置网关</div>' +
    '<div class="set-grid">' +
      field('gOllama', 'Ollama 地址', ol, '仅被读取，不改 Ollama 自身配置（默认 11434）') +
      field('gCtx', '上下文长度 (num_ctx)', s.ollama_num_ctx != null ? s.ollama_num_ctx : 16384, '发给 Ollama 的 KV cache 上限（token）；仅内置网关生效，不动 Ollama 全局', 'number') +
    '</div>' +
    '<div class="set-section">高级</div>' +
    '<div class="set-grid">' +
      field('gMaxOut', 'Claude 输出上限 (token)', mo, 'claude 单次响应 output 上限；思考长/输出大时可调大防报错', 'number') +
      '<div class="set-field">' +
        '<label class="set-label" for="gThink">Ollama 思考 (thinking)</label>' +
        '<label style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); cursor:pointer;">' +
        '<input id="gThink" type="checkbox"' + (th ? ' checked' : '') + '> 保留模型思考块（关掉可大幅降低输出量，gemma 推理模型适用）' +
        '</label>' +
      '</div>' +
    '</div>' +
    '<div class="set-field wide" style="padding:0 22px;">' +
      '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">' +
        '<label class="set-label" for="gConsensus">共识终止提示词（辩论）</label>' +
        '<button type="button" class="ghost" style="font-size:12px; padding:2px 10px;" onclick="setTemplateDefault(\'gConsensus\')">恢复默认</button>' +
      '</div>' +
      '<textarea id="gConsensus" class="set-input" rows="4" style="resize:vertical; font-family:monospace; font-size:12px; width:100%; box-sizing:border-box;">' + esc(consVal) + '</textarea>' +
      '<div class="set-help">当前生效文本（未改过即内置默认）；保存时与默认一致则视为未配置，点「恢复默认」即还原</div>' +
    '</div>' +
    '<div class="set-field wide" style="padding:0 22px;">' +
      '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">' +
        '<label class="set-label" for="gExtraRules">附加规则提示词（每轮常驻）</label>' +
        '<button type="button" class="ghost" style="font-size:12px; padding:2px 10px;" onclick="setTemplateDefault(\'gExtraRules\')">恢复默认</button>' +
      '</div>' +
      '<textarea id="gExtraRules" class="set-input" rows="3" style="resize:vertical; font-family:monospace; font-size:12px; width:100%; box-sizing:border-box;" placeholder="场景专属规则（如盲棋/游戏），留空则无">' + esc(extraVal) + '</textarea>' +
      '<div class="set-help">每轮注入所有 agent 的附加规则；留空＝无</div>' +
    '</div>' +
    '</div>' +
    '<div class="set-foot">' +
      '<button class="set-cancel" onclick="closeModal()">取消</button>' +
      '<button class="primary set-save" onclick="submitSettings()">保存</button>' +
    '</div>';
  // 临时撑宽弹窗（设置面板专用），closeModal 时清掉
  c.style.width = 'min(560px, 92vw)';
  c.style.padding = '0';
  c.style.borderRadius = '16px';
  c.style.overflow = 'hidden';
  c.style.boxShadow = '0 14px 44px rgba(20,30,60,.20)';
  c.style.gap = '0';
  // 限高 + flex 纵向布局：头部/底部固定，中间内容区（set-body）独立滚动，长内容不裁切
  c.style.display = 'flex';
  c.style.flexDirection = 'column';
  c.style.maxHeight = 'min(86vh, 620px)';
  document.getElementById('modal').classList.add('show');
}
// 恢复提示词模板默认：把 textarea 重置为内置默认文本（保存时与默认一致会自动视为未配置）
function setTemplateDefault(id) {
  var defs = (cfg.settings && cfg.settings.prompt_template_defaults && cfg.settings.prompt_template_defaults.debate) || {};
  var key = id === 'gConsensus' ? 'consensus' : 'extra_rules';
  var el = document.getElementById(id);
  if (el) el.value = (defs[key] != null ? defs[key] : '');
}
function submitSettings() {
  var body = {
    default_timeout: parseInt(v('gTimeout'), 10) || 300,
    default_max_rounds: parseInt(v('gMaxRounds'), 10) || 12,
    default_model: v('gDefaultModel').trim(),
    default_model_codex: v('gDefaultModelCodex').trim(),
    ollama_base_url: v('gOllama').trim() || 'http://localhost:11434',
    ollama_num_ctx: parseInt(v('gCtx'), 10) || 16384,
    ollama_think: document.getElementById('gThink').checked,
    claude_max_output_tokens: parseInt(v('gMaxOut'), 10) || 64000,
    prompt_templates: (function () {
      var old = (cfg.settings && cfg.settings.prompt_templates) || {};
      var ptNew = JSON.parse(JSON.stringify(old));
      if (!ptNew.debate) ptNew.debate = {};
      var defs = (cfg.settings && cfg.settings.prompt_template_defaults && cfg.settings.prompt_template_defaults.debate) || {};
      // 与默认一致（或为空）＝视为未配置（删除），避免垃圾配置
      var cons = v('gConsensus').trim();
      if (cons && cons !== (defs.consensus || '')) ptNew.debate.consensus = cons; else delete ptNew.debate.consensus;
      var extra = v('gExtraRules').trim();
      if (extra && extra !== (defs.extra_rules || '')) ptNew.debate.extra_rules = extra; else delete ptNew.debate.extra_rules;
      return ptNew;
    })(),
  };
  return fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) { cfg.settings = d.settings; renderTree(); })
    .then(closeModal).then(function () {
      updateRoundControl();  // 全局默认变化后，未手动改过的轮次输入同步刷新
      setStatus('全局设置已保存 ✓', true);
    })
    .catch(function (e) { setStatus('保存失败: ' + e.message, false); });
}
// 点遮罩关闭：但拖选文字（在卡片内按下、拖到卡片外松手）会误触发 click，
// 且选中文字期间不应关闭设置框，故存在活跃选区时不关闭。
function _backdropClose(e) {
  if (e.target !== this) return;
  var sel = (window.getSelection && window.getSelection()) || '';
  if (sel && sel.toString && sel.toString().trim().length) return;
  this.classList.remove('show');
}
['modal', 'newModal', 'fsModal'].forEach(function (id) {
  document.getElementById(id).addEventListener('click', _backdropClose);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { ['modal', 'newModal', 'fsModal'].forEach(function (id) { document.getElementById(id).classList.remove('show'); }); }
});
// 对话模式：Enter 发送、Shift+Enter 换行（辩论模式的任务框保持多行，不抢 Enter）
document.getElementById('task').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey && isChatMode()) { e.preventDefault(); startSession(); }
});
// 输入变化即刷新主按钮可用态（辩论模式：空议题时「开始/继续讨论」禁用）
document.getElementById('task').addEventListener('input', refreshSendBtn);
// 介入框：Enter 直接介入；Shift+Enter 换行
document.getElementById('inject').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doInject(); }
});

function closeFs() { document.getElementById('fsModal').classList.remove('show'); }

// ---- 目录选择器（服务端驱动，可拿到真实绝对路径）----
function q(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function openFsPicker(initial) { fsRender(initial && initial.trim() ? initial.trim() : ''); document.getElementById('fsModal').classList.add('show'); }
function fsRender(path) {
  document.getElementById('fsCard').className = 'card form-card';
  var url = '/api/fs' + (path ? ('?path=' + encodeURIComponent(path)) : '');
  fetch(url, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      var rows = '';
      if (d.parent) rows += '<div class="fs-item up" onclick="fsNav(\'' + q(d.parent) + '\')">↑ 上一级 (' + esc(d.parent) + ')</div>';
      if (!d.dirs.length) rows += '<div class="fs-empty">此目录下没有子目录</div>';
      d.dirs.forEach(function (x) {
        rows += '<div class="fs-item" onclick="fsNav(\'' + q(x.path) + '\')" ondblclick="fsChoose(\'' + q(x.path) + '\')">' +
          esc(x.name) + '<span class="fs-enter">进入 ›</span></div>';
      });
      var c = document.getElementById('fsCard');
      c.innerHTML = '<h3>选择项目目录</h3>' +
        '<div class="fs-path">' + esc(d.path) + '</div>' +
        '<div class="fs-list">' + rows + '</div>' +
        '<div style="display:flex; gap:8px; margin-top:8px;">' +
        '<button class="primary" onclick="fsChoose(\'' + q(d.path) + '\')">选择此目录</button>' +
        '<button onclick="closeFs()">取消</button></div>';
    })
    .catch(function (e) { document.getElementById('fsCard').innerHTML = '<h3>选择项目目录</h3><div class="fs-empty">加载失败: ' + esc(e.message) + '</div><button onclick="closeFs()">取消</button>'; });
}
function fsNav(p) { fsRender(p); }
function fsChoose(p) { var inp = document.getElementById('path'); if (inp) inp.value = p; closeFs(); }

function submitAgent() {
  var type = v('type');
  var body = { name: v('name'), type: type, role: v('role') };
  if (type === 'claude-code') {
    if (v('modelSrc') === 'default') {
      body.model = null; body.base_url = null; body.api_key = null;
    } else {
      body.model = v('model') || null;
      body.base_url = v('base_url') || null;
      body.api_key = v('api_key') || null;
    }
  } else {
    body.model = v('model') || null;
    body.base_url = null;
    body.api_key = null;
  }
  if (editingId) body.id = editingId;
  return fetch('/api/agents', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); })
    .then(closeModal).then(loadConfig).then(function () { setStatus('已保存 ✓', true); })
    .catch(function (e) { setStatus('保存失败: ' + e.message, false); });
}
function submitTeam() {
  var ids = getMultiSelected('mAgents');
  var body = { name: v('name'), agent_ids: ids };
  if (editingId) body.id = editingId;
  return fetch('/api/teams', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); })
    .then(closeModal).then(loadConfig).then(function () { setStatus('已保存 ✓', true); })
    .catch(function (e) { setStatus('保存失败: ' + e.message, false); });
}
function submitProject() {
  var ids = getMultiSelected('mTeams');
  var body = { name: v('name'), path: v('path'), team_ids: ids };
  if (editingId) body.id = editingId;
  return fetch('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(closeModal).then(loadConfig).then(function () { setStatus('已保存 ✓', true); })
    .catch(function (e) { setStatus('保存失败: ' + e.message, false); });
}
function v(id) { var e = document.getElementById(id); return e ? e.value : ''; }

loadConfig();
</script>
